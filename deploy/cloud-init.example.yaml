#cloud-config
users:
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    hashed_passwd: 'REPLACE_WITH_ADMIN_PASSWORD_HASH'
    sudo: 'ALL=(ALL:ALL) ALL'
    ssh_authorized_keys:
      - REPLACE_WITH_OWNER_PUBLIC_KEY
  - name: crew
    shell: /bin/bash
    lock_passwd: true
disable_root: true
ssh_pwauth: false
write_files:
  - path: /etc/ssh/sshd_config.d/00-crew-bootstrap.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers admin
