# The Xcode project for Crew on iPhone, generated by XcodeGen so it stays readable
# in review: `pnpm ios` (or `xcodegen generate` here) makes Crew.xcodeproj and
# Crew/Info.plist, which are not checked in. The app's code lives in CrewKit/ (a Swift package).
name: Crew
options:
  bundleIdPrefix: dev.crew
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  CrewKit:
    path: CrewKit
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # Your Apple Developer team: set it in Xcode (Signing & Capabilities), or here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Crew:
    type: application
    platform: iOS
    sources:
      - Crew
    dependencies:
      - package: CrewKit
        product: CrewUI
      - package: CrewKit
        product: CrewKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crew.ios
        PRODUCT_NAME: Crew
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crew
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Crew/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          # crew://signed-in: the Cloudflare Access sign-in comes back here.
          - CFBundleURLName: dev.crew.ios
            CFBundleURLSchemes: [crew]
        NSAppTransportSecurity:
          # A conductor on your Mac (http://127.0.0.1) for development; servers are https.
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
